<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepFusion 深融</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <!-- ══ 左侧边栏：Reasonix 结构（品牌 → 导航 → 会话 → 监控） ══ -->
  <aside id="sidebar-left" class="sidebar-left">
    <div class="sidebar__brand">
      <span class="brand-wordmark">Deep<span>Fusion</span> 深融</span>
    </div>
    <nav class="sidebar__nav">
      <button class="sidebar__item sidebar__item--accent" id="btn-new-conv" title="新建对话">＋ 新建对话</button>
      <button class="sidebar__item" id="btn-goal" title="多代理执行（总指挥拆解 → 子代理池）">🧩 多代理</button>
      <button class="sidebar__item" id="btn-orch" title="启动编排">⚡ 编排</button>
      <div class="sidebar__sep"></div>
      <button class="sidebar__item" id="btn-settings" title="设置">⚙ 设置</button>
      <button class="sidebar__item" id="btn-phone" title="手机访问">📱 手机访问</button>
    </nav>
    <div class="sidebar__label-row">
      <span class="sidebar__label">会话</span>
      <span id="session-count" class="session-item__meta"></span>
    </div>
    <div class="session-search">
      <input id="conv-search" class="session-search__input" type="search" placeholder="搜索会话…">
      <button id="btn-conv-sort" class="btn-ghost" title="排序">⇅</button>
    </div>
    <div id="conv-groups" class="conv-groups"></div>
    <div class="sidebar__section">
      <div class="sidebar__ctx">
        <div class="ctx-bar"><div class="ctx-bar__fill" id="ctx-fill" style="width:0%"></div></div>
        <div class="ctx-label"><span id="ctx-num">0%</span><span id="ctx-detail">原始 -- · 压缩 --</span></div>
      </div>
      <div class="status-metrics">
        <div class="sm-item"><span class="sm-val acc" id="m-cost">--</span><span class="sm-label">费用</span></div>
        <div class="sm-item"><span class="sm-val" id="m-run">--</span><span class="sm-label">时长</span></div>
        <div class="sm-item"><span class="sm-val" id="m-req">--</span><span class="sm-label">请求</span></div>
        <div class="sm-item"><span class="sm-val" id="m-cache">--</span><span class="sm-label">缓存</span></div>
      </div>
      <div id="breakdown" class="breakdown"></div>
      <div id="subagents" class="subagents"><div class="empty">0 个激活</div></div>
      <div class="status" id="sidebar-status">引擎就绪</div>
      <div id="account-mini" class="account-mini">余额 --</div>
    </div>
  </aside>

  <!-- ══ 中间主区：多标签核心交互区 ══ -->
  <main id="main" class="main">
    <div class="main-tabs">
      <button class="tab-btn active" data-tab="chat">💬 对话</button>
      <button class="tab-btn" data-tab="trace">🕸 思考轨迹</button>
      <button class="tab-btn" data-tab="context">🧠 上下文</button>
      <div class="tab-spacer"></div>
      <div id="agents-badge" class="agents-badge hidden" title="激活子代理">⚙ 0 激活</div>
    </div>

    <!-- 对话页 -->
    <div id="panel-chat" class="tab-panel active">
      <div id="chat-window" class="chat-window"></div>
      <!-- ══ 底部输入栏（Reasonix footer） ══ -->
      <div id="bottom-bar" class="footer">
        <div class="bb-row1">
          <div class="bb-tools">
            <button class="tool-btn" id="btn-upload" title="上传文件">📎</button>
            <button class="tool-btn" id="btn-term" title="终端调用">🖥</button>
            <button class="tool-btn" id="btn-web" title="网页访问">🌐</button>
            <button class="tool-btn" id="btn-repo" title="代码仓库">📦</button>
            <select id="orch-mode" class="tool-select" title="编排模式">
              <option value="fanout">扇出</option>
              <option value="pipeline">流水线</option>
              <option value="map-reduce">拆分-归约</option>
              <option value="supervisor">评审合成</option>
            </select>
          </div>
          <div class="bb-modes" id="mode-bar">
            <button class="mode-btn active" data-mode="normal" title="常规">常规</button>
            <button class="mode-btn" data-mode="ask" title="工具执行前需确认">询问</button>
            <button class="mode-btn" data-mode="auto" title="自主调用工具">自动</button>
            <button class="mode-btn" data-mode="yolo" title="无限制自主执行">Yolo</button>
            <button class="mode-btn" data-mode="standard" title="标准">标准</button>
            <button class="mode-btn" data-mode="deliver" title="交付模式">交付</button>
          </div>
        </div>
        <div class="bb-input-row">
          <textarea id="chat-input" placeholder="输入消息… Enter 发送 / Shift+Enter 换行" rows="3"></textarea>
          <div class="bb-actions">
            <button id="btn-chat-stop" class="btn-ghost hidden" title="停止生成">⏹ 停止</button>
            <button id="btn-chat-send" class="btn-primary">发送 ↑</button>
          </div>
        </div>
        <div class="bb-meta">
          <select id="chat-model" class="chat-model" title="模型切换">
            <option value="tokenrhythm/deepseek-v4-flash">deepseek-v4-flash</option>
            <option value="tokenrhythm/deepseek-v4-pro">deepseek-v4-pro</option>
            <option value="tokenrhythm/glm-5.2">glm-5.2</option>
            <option value="tokenrhythm/kimi-k2.5">kimi-k2.5</option>
            <option value="tokenrhythm/qwen3.7-max">qwen3.7-max</option>
          </select>
          <span class="dot-sep">·</span>
          <span id="token-est">0 tok</span>
          <span class="dot-sep">·</span>
          <span id="chat-cost"></span>
        </div>
      </div>
    </div>

    <!-- 思考轨迹页 -->
    <div id="panel-trace" class="tab-panel">
      <div id="trace-window" class="trace-window"><div class="panel-empty">思考轨迹将在此展示任务拆解与子代理全链路</div></div>
    </div>

    <!-- 上下文页 -->
    <div id="panel-context" class="tab-panel">
      <div id="context-window" class="context-window"><div class="panel-empty">系统提示词 / 历史对话 / 工具调用记录管理</div></div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
